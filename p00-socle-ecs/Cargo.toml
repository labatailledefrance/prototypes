[package]
name = "p00-socle-ecs"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy_ecs = { version = "0.20.1", default-features = false, features = ["std", "multi_threaded", "async_executor"] }
bevy_tasks = { version = "0.20.1", features = ["multi_threaded"] }
clap = { version = "4.6.7", features = ["derive"] }
rayon = "1.12.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
