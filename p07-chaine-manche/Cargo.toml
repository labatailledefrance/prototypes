[package]
name = "p07-chaine-manche"
version = "0.1.0"
edition = "2024"

# Versions vérifiées sur crates.io le 2026-11-16, choisies vieilles d'au moins
# deux semaines.
[dependencies]
# SQLite compilé depuis ses sources (la machine n'a pas de libsqlite3-dev) :
# un GeoPackage est une base SQLite.
rusqlite = { version = "=0.41.1", features = ["bundled"] }
# Lecture en flux des archives 7z de l'IGN, sans décompression sur disque.
sevenz-rust2 = { version = "=0.24.1", default-features = false, features = ["compress"] }
zstd = "=0.14.3"
rayon = "=1.12.0"
blake3 = "=1.8.7"
png = "=0.18.1"
clap = { version = "4.6.7", features = ["derive"] }
# Carreaux de 200 m de l'INSEE (Parquet de data.gouv.fr), API par lignes,
# sans Arrow.
parquet = { version = "=59.3.2", default-features = false, features = ["snap", "zstd", "flate2", "flate2-rust_backend", "lz4", "brotli"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = false
