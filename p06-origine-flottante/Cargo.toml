[package]
name = "p06-origine-flottante"
version = "0.1.0"
edition = "2024"

[dependencies]
# Bevy complet pour le rendu, sans audio ni manettes. Wayland est indispensable :
# sur cette machine, la RTX 3060 n'accepte que les surfaces Wayland. Les en-têtes
# de libwayland sont absents : `wayland-sys` en `dlopen` charge la bibliothèque à
# l'exécution au lieu de la lier.
bevy = { version = "0.20.1", default-features = false, features = [
  "std", "multi_threaded", "async_executor", "default_app", "3d_bevy_render",
  "bevy_winit", "x11", "wayland", "default_font", "ui_api", "ui_bevy_render", "sysinfo_plugin",
] }
big_space = "=0.14.0-rc.0"
clap = { version = "4.6.7", features = ["derive"] }
zstd = "0.13.3"
wayland-sys = { version = "0.31.11", features = ["dlopen"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16

[profile.dev.package."*"]
opt-level = 2
